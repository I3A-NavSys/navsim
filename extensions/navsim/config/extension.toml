[core]
reloadable = true
order = 0

[package]
version = "2.0.0"
category = "Simulation"
title = "NavSim - Consola"
description = "Motor físico/inercial vectorizado y transceptor MAVLink v2 para flotas heterogéneas de UAVs en Isaac Sim."
authors = ["Unidad de Transferencia de Conocimiento en Movilidad Aérea Avanzada Mediante Aeronaves No Tripuladas (UCLM-UAS)"]
repository = ""
keywords = ["uav", "mavlink", "isaacsim", "dynamics"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}
"isaacsim.gui.components" = {}
"isaacsim.core.api" = {}
"omni.kit.menu.utils" = {}
"omni.kit.viewport.utility" = {}

[python.pipapi]
requirements = [
    "pyyaml",
    "pyproj"
]
use_online_index = true

[[python.module]]
name = "navsim_python"