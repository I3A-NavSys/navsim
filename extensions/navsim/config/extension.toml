[core]
reloadable = true
order = 0

[package]
version = "0.2.0"
category = "Simulation"
title = "navsim"
description = "Motor físico/inercial vectorizado y transceptor MAVLink v2 para flotas heterogéneas de UAVs en Isaac Sim."
authors = ["Víctor Blázquez Milara", "Iker Nebot Amoriza", "Rafael Casado González", "Aurelio Bermúdez Marín"]
repository = ""
keywords = ["uav", "mavlink", "isaacsim", "dynamics"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}
"isaacsim.gui.components" = {}
"isaacsim.core.api" = {}

[python.pipapi]
requirements = [
    "pyyaml",
    "pyproj"
]
use_online_index = true

[[python.module]]
name = "navsim_python"