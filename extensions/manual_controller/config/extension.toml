[core]
reloadable = true
order = 10

[package]
version = "2.0.0"
category = "Simulation"
title = "NavSim - Joystick"
description = "Controlador manual para UAVs mediante joystick y MAVLink v2 en Isaac Sim"
authors = ["Unidad de Transferencia de Conocimiento en Movilidad Aérea Avanzada Mediante Aeronaves No Tripuladas (UCLM-UAS)"]
repository = ""
keywords = ["controller", "UAV", "Drone", "joystick", "mavlink"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}
"isaacsim.gui.components" = {}
"isaacsim.core.api" = {}
"omni.kit.viewport.window" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.menu.utils" = {}

[python.pipapi]
requirements = ["pygame"]
use_online_index = true

[[python.module]]
name = "manual_controller_python"
