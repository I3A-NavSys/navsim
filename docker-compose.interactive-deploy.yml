version: '3.8'

services:
  interactive-deploy:
    build:
      context: .
      dockerfile: docker/GT_creation/Dockerfile
    container_name: navsim-interactive-deploy
    volumes:
      # Mount the entire Windows C: drive to /host/c in the container
      - C:/:/host/c
      # If you have other drives, you can mount them too
      # - D:/:/host/d
    environment:
      - TERM=xterm
    stdin_open: true
    tty: true
    working_dir: /app

networks:
  navsim-network:
    driver: bridge